<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>

    <div class="container">
        <h1>Login</h1>

        <form>
            <div class="input-box">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-box">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required>
            </div>

            <button type="button" class="btn"><a href="home.html">Entrar</a></button>
        </form>

    </div>

</body>
</html>
